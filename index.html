<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hand Tracking Polygon</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #container {
      position: relative;
      /* Actual size is set by JS once the camera reports its real resolution. */
    }
    #video, #canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform: scaleX(-1); /* mirror for natural selfie view */
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted width="1280" height="720"></video>
    <canvas id="canvas" width="1280" height="720"></canvas>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
